name: weekly-report

on:
  schedule:
    - cron: "0 2 * * 1"   # Mondays 02:00 UTC = 07:30 IST
  workflow_dispatch:

permissions:
  contents: write   # git-backed state mode: commits state/agent.db

concurrency:
  group: state-db   # serialize ALL state mutations (engine + approval + publish)
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SQLITE_PATH: state/agent.db
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
      DISCORD_CHANNEL_ANALYTICS: ${{ secrets.DISCORD_CHANNEL_ANALYTICS }}
      DISCORD_CHANNEL_GENERAL: ${{ secrets.DISCORD_CHANNEL_GENERAL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - run: python scripts/run_pipeline.py --stage weekly-report
      - name: Commit state
        run: |
          git config user.name "social-engine-bot"
          git config user.email "ansaribilal14@users.noreply.github.com"
          mkdir -p state
          git add state/agent.db
          if git diff --cached --quiet; then
            echo "state unchanged"
          else
            git commit -m "chore(state): weekly report ${{ github.run_id }}"
            git pull --rebase origin "$GITHUB_REF_NAME" || true
            git push origin HEAD:"$GITHUB_REF_NAME"
          fi

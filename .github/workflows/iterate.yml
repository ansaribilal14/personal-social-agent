name: iterate

# SECURITY (spec sections 33/51):
# - comment body reaches Python ONLY via env vars, never interpolated into shell
# - authorization + replay protection happen inside the pipeline
# - only the exact /iterate command is processed; all other text is ignored

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

concurrency:
  group: content-issue-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  iterate:
    if: ${{ !github.event.issue.pull_request && startsWith(github.event.comment.body, '/iterate') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      GITHUB_TOKEN: ${{ github.token }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      COMMENT_BODY: ${{ github.event.comment.body }}
      COMMENT_ACTOR: ${{ github.event.comment.user.login }}
      COMMENT_ID: ${{ github.event.comment.id }}
      ISSUE_ID: ${{ github.event.issue.number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Handle /iterate (auth + versioning + quality)
        run: python scripts/review_comment_handler.py --mode iterate
      - name: Commit state (git-backed mode; otherwise iteration is lost)
        run: |
          git config user.name "social-engine-bot"
          git config user.email "ansaribilal14@users.noreply.github.com"
          mkdir -p state
          git add state/agent.db
          if git diff --cached --quiet; then
            echo "state unchanged"
          else
            git commit -m "chore(state): iterate on issue ${{ github.event.issue.number }}"
            git pull --rebase origin "$GITHUB_REF_NAME" || true
            git push origin HEAD:"$GITHUB_REF_NAME"
          fi

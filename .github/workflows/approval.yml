name: approval

# Processes /approve and /reject on review issues.
# SECURITY: same model as iterate.yml - comment content via env only,
# authorized actors enforced in code, replay protection in DB (spec 34, 51).

on:
  issue_comment:
    types: [created]

permissions:
  contents: write   # git-backed state mode: commits state/agent.db
  issues: write

concurrency:
  group: state-db   # serialize ALL state mutations (engine + approval + publish)
  cancel-in-progress: false

jobs:
  approval:
    if: ${{ !github.event.issue.pull_request && (startsWith(github.event.comment.body, '/approve') || startsWith(github.event.comment.body, '/reject')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      SQLITE_PATH: state/agent.db
      GITHUB_TOKEN: ${{ github.token }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
      DISCORD_CHANNEL_REVIEW: ${{ secrets.DISCORD_CHANNEL_REVIEW }}
      DISCORD_CHANNEL_ALERTS: ${{ secrets.DISCORD_CHANNEL_ALERTS }}
      DISCORD_CHANNEL_GENERAL: ${{ secrets.DISCORD_CHANNEL_GENERAL }}
      COMMENT_BODY: ${{ github.event.comment.body }}
      COMMENT_ACTOR: ${{ github.event.comment.user.login }}
      COMMENT_ID: ${{ github.event.comment.id }}
      ISSUE_ID: ${{ github.event.issue.number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Handle /approve or /reject (auth + version match + state machine)
        run: python scripts/review_comment_handler.py --mode approval
      - name: Commit state
        run: |
          git config user.name "social-engine-bot"
          git config user.email "ansaribilal14@users.noreply.github.com"
          mkdir -p state
          git add state/agent.db
          if git diff --cached --quiet; then
            echo "state unchanged"
          else
            git commit -m "chore(state): approval on issue ${{ github.event.issue.number }} by ${{ github.event.comment.user.login }}"
            git pull --rebase origin "$GITHUB_REF_NAME" || true
            git push origin HEAD:"$GITHUB_REF_NAME"
          fi

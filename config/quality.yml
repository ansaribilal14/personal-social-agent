# Quality engine configuration (spec sections 23-25).
# The final PASS/FAIL/REVISE decision is COMPUTED IN CODE from these thresholds -
# never from a single LLM-asserted score.

thresholds:
  min_overall_score: 75          # weighted composite, computed in code
  min_critic_score: 70           # any critic below this -> REVISE at minimum
  fail_on_critic_failed: true    # any critic returning passed=false on a hard gate -> FAIL
  max_revision_cycles: 3         # after this, candidates go to review with honest scores

hard_gates:                      # passed=false on these -> FAIL regardless of scores
  - platform_fit
  - antislop
  - fact
  - post_shape                   # posts must be shaped like posts, not essays

# Deterministic anti-slop ruleset (editable). Combined with NIM-based judgment,
# never replaced by it.
anti_slop:
  banned_phrases:
    - "In today's fast-paced world"
    - "game-changer"
    - "Let's dive in"
    - "Let's deep dive"
    - "buckle up"
    - "I'm thrilled to"
    - "revolutionize"
    - "unlock the power"
    - "In conclusion"
    - "As an AI"
    - "delve into"
    - "tapestry"
    - "navigate the landscape"
    - "It's not just X, it's Y"
    - "As an opinion"
    - "Hot take:"
    - "My take:"
    - "game changer"
    - "the future of"
    - "a new era"
    - "at the intersection of"
    - "paves the way"
    - "bridges the gap"
    - "raises important questions"
    - "a testament to"
    - "sparks a conversation"
    - "unleash"
    - "harness the power"
    - "supercharge"
  max_emoji_count: 0
  max_em_dash_per_post: 1
  max_exclamation_marks: 0
  max_hashtags: 2
  ban_engagement_bait: true      # "RT if", "like if", "follow for", "comment below"
  ban_fake_urgency: true         # "before it's too late", "you won't believe"
  ban_fabricated_experience: true # first-person experience claims require PERSONAL_EXPERIENCE claim backing
  min_substantive_ratio: 0.5     # share of sentences carrying observation/opinion/evidence (calibrated on shaped live posts)
  ban_meta_labels: true          # "As an opinion:", "Hot take:", "A thread:" - writing, not announcing
  ban_not_x_its_y: true          # "not X, it's Y" / "isn't a luxury - it's the critical path"
  ban_press_release: true        # "opens design space", "moves the field", "unleashes"...
  ban_abstract_soup: true        # sentences built from landscape/ecosystem/paradigm/etc.
  min_concrete_anchors: 1        # every post needs >=1 number, quote, or named specific
  # --- v4 families (researched from 18 open-source post-generation repos:
  # --- blader/humanizer, avoid-ai-writing, brandonwise/humanizer,
  # --- arvindrk/twitter-agent, langchain-ai/social-media-agent) ---
  ban_staged_runup: true         # "Let me tell you", "Here's the thing:", "Honestly,"
  ban_summary_closers: true      # "That's the real win.", "No hype. Just shipping.", "Period."
  ban_countdown_negation: true   # "It's not the price. It's not the features. It's the trust."
  ban_borrowed_authority: true   # "experts say", "studies show", "everyone knows"
  ban_chatbot_residue: true      # "Great question!", "I hope this helps", "In summary"
  ban_x_lexicon: true            # "Thrilled to share", "Let that sink in", ending "Thoughts?"
  ban_ing_riders: true           # "..., showcasing seamless integration"
  ban_copula_avoidance: true     # "serves as" -> "is"
  ban_uniform_rhythm: true       # 5+ sentences of near-equal length = AI burstiness fingerprint
  max_punch_word_run: 4          # final block sharing >=4 verbatim words with an exemplar
                                 # punch = canned echo ("Default is the bug." dodged the
                                 # old default of 5; live run 34333991666)

similarity:                      # originality engine thresholds (0..1)
  exact: 0.98
  near: 0.85
  semantic: 0.45                 # trigram cosine (embeddings when available);
                                 # measured separation: reworded dup ~0.50, distinct ~0.05
  hook: 0.75
  max_history_lookback: 200      # compare against this many recent variants

claims:
  fact_requires_source: true     # FACT claims without a research source -> UNVERIFIED -> rewrite
  allow_speculation_unverified: true
  unverified_policy: rewrite     # rewrite | remove | block
